name: Envio horário dos melhores leads

on:
  schedule:
    # Tentativas fora do minuto zero evitam o pico do scheduler do GitHub.
    # A trava transacional no banco limita o total real a 50 em qualquer hora,
    # mesmo que mais de uma tentativa seja iniciada.
    - cron: "7,22,37,52 12-19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tironi-outreach-hourly
  cancel-in-progress: false

jobs:
  send:
    name: Enviar melhores leads da hora
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISPATCH_URL: ${{ vars.PUBLIC_BASE_URL || 'https://tironi-outreach.vercel.app' }}/api/dispatch/hourly
      CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.UNSUBSCRIBE_SECRET }}

    steps:
      - name: Validar configuração
        run: |
          test -n "$CRON_SECRET" || { echo "CRON_SECRET ou UNSUBSCRIBE_SECRET ausente"; exit 1; }

      - name: Disparar lote no backend
        run: |
          set -o pipefail
          curl --silent --show-error --fail-with-body \
            --max-time 240 \
            --request POST \
            --header "X-Cron-Secret: $CRON_SECRET" \
            --header "Content-Type: application/json" \
            "$DISPATCH_URL" | tee hourly-result.json

      - name: Publicar resumo
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path("hourly-result.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Janela horária Tironi Tech\n")
              if not result_path.exists():
                  summary.write("A execução terminou antes de gerar o resultado.\n")
              else:
                  data = json.loads(result_path.read_text(encoding="utf-8"))
                  labels = {
                      "processed": "Processados",
                      "sent": "Aceitos pelo SMTP",
                      "failed": "Falhas",
                      "queued": "Ainda na fila",
                      "remaining_daily": "Saldo diário",
                      "would_send": "Seriam enviados",
                  }
                  for key, label in labels.items():
                      if key in data:
                          summary.write(f"- {label}: `{data[key]}`\n")
          PY
